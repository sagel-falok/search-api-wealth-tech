[project]
name = "search-api"
version = "0.1.0"
description = "Nevis WealthTech Search API across clients and documents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.30.0",
    "fastapi-mcp>=0.4.0",
    "fastapi[standard]>=0.115.0",
    "fastembed>=0.9.1",
    "mcp<2.0.0",
    "openai>=1.50.0",
    "pgvector>=0.5.1",
    "pydantic-settings>=2.6.0",
    "pydantic[email]>=2.10.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]
